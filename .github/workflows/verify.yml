name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run ci
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build container
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ./
          load: true
          tags: steadybit/cli:latest
      - name: Test container
        run: docker run --rm steadybit/cli:latest -V
      # Everything these cover needs a real process: an exit status, a terminal, or the
      # spawn of a subcommand. They run against the image users install, built from the
      # npm tarball, so the packaging is exercised too.
      - name: Build smoke test container
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ./
          file: ./Dockerfile.e2e
          build-args: IMAGE=steadybit/cli:latest
          load: true
          tags: steadybit/cli:smoke-test
      - name: Run container smoke tests
        run: docker run --rm steadybit/cli:smoke-test

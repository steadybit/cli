name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run ci
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build container
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ./
          load: true
          # Tagged by commit, not `latest`. A tag that also exists on Docker Hub can be
          # resolved from there instead of from this build without anything failing, so
          # the smoke tests would quietly exercise the last release.
          tags: steadybit/cli:ci-${{ github.sha }}
      - name: Test container
        run: docker run --rm steadybit/cli:ci-${{ github.sha }} -V
      # Everything these cover needs a real process: an exit status, a terminal, or the
      # spawn of a subcommand. They run against the image users install, built from the
      # npm tarball, so the packaging is exercised too.
      - name: Run container smoke tests
        run: |
          docker run --rm -v "$PWD/e2e:/e2e" --entrypoint sh \
            steadybit/cli:ci-${{ github.sha }} /e2e/run.sh

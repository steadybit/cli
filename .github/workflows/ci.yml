name: CI

on:
  push:
    branches: [main]
    tags:
      - v**
  workflow_dispatch:
  pull_request:
    branches: [main]
  # Daily, so a breaking change in the platform API is noticed within a day of it
  # reaching production rather than at the next release of the CLI.
  schedule:
    - cron: '0 5 * * 1-5'

jobs:
  verify:
    # Paths, terminals and line endings differ between them, and users run all three.
    strategy:
      # Each platform's failures are worth seeing, not only the first one's.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l api cmd internal)" || { gofmt -l api cmd internal; exit 1; }
      - name: The generated client matches the committed spec
        if: runner.os != 'Windows'
        run: |
          go generate ./api
          git diff --exit-code -- api/platform.gen.go
      - run: go vet ./...
      - run: go test ./...

  # The committed spec is what the CLI was built against; this checks it against the live
  # platform. A breaking change to an endpoint the CLI uses fails to compile and fails the
  # job, which also blocks a release. Changes the CLI does not depend on only warn.
  api-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./internal/tools/spec fetch
      - run: go generate ./api
      - name: Build against the live platform API
        run: go build ./... && go vet ./...
      - name: Report API changes
        if: always()
        run: |
          # The raw spec is not compared: the platform orders some of its maps differently
          # from one response to the next. The generated client is deterministic.
          if git diff --quiet -- api/platform.gen.go; then
            echo "The live platform API matches the committed client." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The platform API changed. Run \`go run ./internal/tools/spec fetch && go generate ./api\` and commit the result."
            {
              echo "### The platform API changed"
              echo
              echo '```'
              git diff --stat -- api/platform.gen.go
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # Nightly, a quick look that the CLI still talks to the real platform: the test team's
  # token works and the answers still decode. The whole flow runs weekly, in
  # platform-e2e.yml.
  platform-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [verify]
    runs-on: ubuntu-latest
    env:
      STEADYBIT_URL: https://platform.dev.steadybit.com
      STEADYBIT_TOKEN: ${{ secrets.STEADYBIT_E2E_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o steadybit ./cmd/steadybit
      - name: Read the test team and its latest runs
        run: |
          test "$(./steadybit team get -k CLI --jq .key)" = CLI
          ./steadybit execution list --team CLI --limit 1 -t json >/dev/null
          ./steadybit environment list -t json --jq 'length' >/dev/null

  docker-build:
    if: github.event_name != 'schedule'
    # Images are pushed from here, so a tag whose tests fail must not publish one.
    needs: [verify, api-compatibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Determine tags to publish
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            MAJOR="${VERSION%%.*}"
            if [[ "${VERSION}" == *-* ]]; then
              # A prerelease such as 6.1.0-rc.1 is published under its own version only.
              echo "tags=steadybit/cli:${VERSION}" >> "$GITHUB_OUTPUT"
            else
              echo "tags=steadybit/cli:latest,steadybit/cli:${MAJOR},steadybit/cli:${VERSION}" >> "$GITHUB_OUTPUT"
            fi
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            echo "tags=steadybit/cli:main" >> "$GITHUB_OUTPUT"
            echo "version=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=" >> "$GITHUB_OUTPUT"
            echo "version=pr-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
      - id: build
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ./
          load: true
          build-args: VERSION=${{ steps.tags.outputs.version }}
      - name: Test container
        # The version is stamped in at build time; a binary reporting anything else was built
        # without it.
        run: test "$(docker run --rm ${{ steps.build.outputs.imageid }} -V)" = "${{ steps.tags.outputs.version }}"
      - name: Run container smoke tests
        run: |
          docker run --rm -v "$PWD/e2e:/e2e" --entrypoint sh \
            ${{ steps.build.outputs.imageid }} /e2e/run.sh
      - if: steps.tags.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - if: steps.tags.outputs.push == 'true'
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: ./
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ steps.tags.outputs.version }}
      - name: 'snyk monitor docker image'
        if: startsWith(github.ref, 'refs/tags/v')
        uses: snyk/actions/docker@master
        with:
          image: 'steadybit/cli:${{ steps.tags.outputs.version }}'
          args: --file=Dockerfile --username=${{ secrets.DOCKER_USERNAME }} --password=${{ secrets.DOCKER_PASSWORD }}
          command: monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, api-compatibility, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The key the agent's packages are signed with, so apt and yum trust the CLI's too.
      # Outside the checkout: goreleaser refuses to release from a tree with untracked files.
      - name: Export the package signing key
        env:
          SECRET: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: echo -n "$SECRET" > "$RUNNER_TEMP/gpg.key"
      - name: Binaries, archives, Linux packages, the GitHub release and the Homebrew cask
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the cask to steadybit/homebrew-tap, which GITHUB_TOKEN cannot write to.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NFPM_KEY_FILE: ${{ runner.temp }}/gpg.key
          NFPM_PASSPHRASE: ${{ secrets.MAVEN_GPG_PRIVATE_KEY_PASSWORD }}
      - name: Remove the package signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/gpg.key"
      # `uses: steadybit/cli@v6` resolves through the major tag, so each stable release
      # moves it. A push with GITHUB_TOKEN triggers no workflow, so the tag does not start
      # another release.
      - name: Move the major version tag of the action
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "${major}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${major}"
      - name: 'snyk monitor'
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor

  # The signed packages of a release, installed before they are published to the apt and yum
  # repositories. A job of its own, so that a failing upload leaves the release, the cask and
  # the major tag in place and does not skip verify-action.
  release-linux-packages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploading authenticates to Google Cloud as the workflow.
      id-token: write
    steps:
      - name: Download the packages from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --dir packages --pattern 'steadybit-cli_*.deb' --pattern 'steadybit-cli_*.rpm'
          ls -l packages
      - name: Install the .deb and run it
        run: |
          sudo apt-get install -y ./packages/steadybit-cli_amd64.deb
          steadybit -V
          test "$(steadybit -V)" = "${GITHUB_REF_NAME#v}"
      # Off until Google Cloud lets this repository upload: the workload identity provider
      # has to trust steadybit/cli first. The repository variable turns it on. Prereleases
      # stay off the repositories, as they stay off releases/latest.
      - name: Publish the Linux packages to packages.steadybit.com
        if: ${{ !contains(github.ref_name, '-') && vars.PUBLISH_LINUX_PACKAGES == 'true' }}
        uses: steadybit/.github/actions/gar-upload-linux-packages@main
        with:
          workload_identity_provider: ${{ secrets.GCP_ARTIFACT_REGISTRY_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ARTIFACT_REGISTRY_PROJECT_SA }}
          project_id: ${{ vars.GCP_ARTIFACT_REGISTRY_PROJECT_ID }}
          location: ${{ vars.GCP_ARTIFACT_REGISTRY_PROJECT_LOCATION }}
          deb_repository: deb-public
          yum_repository: yum-public
          packages_dir: ./packages

  # The packages of every build, installed and run on the distributions they are for. On
  # main they are also signed and go to the dev repositories, which is how the upload is
  # checked before a release depends on it. Other refs, pull requests and branches started
  # by hand, build them unsigned and upload nothing, so the production key signs only main.
  linux-packages:
    if: github.event_name != 'schedule' && !startsWith(github.ref, 'refs/tags/')
    # As docker-build: nothing reaches the dev repositories from a build whose checks fail.
    needs: [verify, api-compatibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Export the package signing key
        if: github.ref == 'refs/heads/main'
        env:
          SECRET: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          echo -n "$SECRET" > "$RUNNER_TEMP/gpg.key"
          echo "NFPM_KEY_FILE=$RUNNER_TEMP/gpg.key" >> "$GITHUB_ENV"
      - name: Build the packages
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean
        env:
          HOMEBREW_TAP_TOKEN: unused
          NFPM_PASSPHRASE: ${{ secrets.MAVEN_GPG_PRIVATE_KEY_PASSWORD }}
      - name: Remove the package signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/gpg.key"
      - name: Install the .deb and run it
        run: |
          sudo apt-get install -y ./dist/steadybit-cli_amd64.deb
          steadybit -V
          test -f /usr/share/bash-completion/completions/steadybit
      - name: Install the .rpm and run it
        run: |
          docker run --rm -v "$PWD/dist:/dist" fedora:latest \
            sh -c 'dnf install -y -q /dist/steadybit-cli_amd64.rpm && steadybit -V'
      - name: Publish to the dev repositories
        if: github.ref == 'refs/heads/main' && vars.PUBLISH_LINUX_PACKAGES == 'true'
        uses: steadybit/.github/actions/gar-upload-linux-packages@main
        with:
          workload_identity_provider: ${{ secrets.GCP_ARTIFACT_REGISTRY_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ARTIFACT_REGISTRY_PROJECT_SA }}
          project_id: ${{ vars.GCP_ARTIFACT_REGISTRY_PROJECT_ID }}
          location: ${{ vars.GCP_ARTIFACT_REGISTRY_PROJECT_LOCATION }}
          deb_repository: deb-dev
          yum_repository: yum-dev
          packages_dir: ./dist

  # The action downloads from the release, so it can only be checked once one exists.
  verify-action:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./
        with:
          version: ${{ github.ref_name }}
      - shell: bash
        run: |
          steadybit --version
          test "$(steadybit --version)" = "${GITHUB_REF_NAME#v}"
          test "${{ steps.setup.outputs.version }}" = "${GITHUB_REF_NAME#v}"

  # A stable release is used against the platform right away, as installed by the action.
  platform-e2e:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: verify-action
    uses: ./.github/workflows/platform-e2e.yml
    secrets: inherit

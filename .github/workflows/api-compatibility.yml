name: API compatibility
# The committed spec is what the CLI was built against; this builds the CLI against the spec a
# platform serves now. A breaking change to an endpoint the CLI uses fails to compile and fails
# the job. Changes the CLI does not depend on only warn. With coverage, it also fails when the
# platform has an operation no command calls and internal/tools/spec/coverage.go does not list
# with a reason.
on:
  # From ci.yml, on the code it builds, and from spec-diff-platform-*.yml, which the development
  # dashboard shows.
  workflow_call:
    inputs:
      platform:
        description: The base URL of the platform whose API the CLI is built against
        type: string
        required: true
      build:
        description: '"caller" builds the commit the caller runs for, "latest release" the latest release'
        type: string
        default: caller
      coverage:
        type: boolean
        default: false
      # Keeps one issue open while operations are uncovered, and closes it after. Only one caller
      # does, so two do not overwrite each other's issue. Needs issues: write from the caller.
      issue:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      platform:
        description: The platform whose API the CLI is built against
        type: choice
        options:
          - https://platform.dev.steadybit.com
          - https://platform.steadybit.com
        default: https://platform.dev.steadybit.com
      build:
        description: The CLI to build
        type: choice
        options: [main, latest release]
        default: main
jobs:
  api-compatibility:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      PLATFORM: ${{ inputs.platform }}
      BUILD: ${{ inputs.build }}
      STEADYBIT_SPEC_URL: ${{ inputs.platform }}/api/spec
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build == 'main' && 'main' || '' }}
          fetch-depth: 0
      - name: Check out the latest release
        if: env.BUILD == 'latest release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          git checkout --quiet "$tag"
          echo "Building $tag" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./internal/tools/spec fetch
      - run: go generate ./api
      - name: Build against the live platform API
        run: go build ./... && go vet ./...
      - name: Report API changes
        if: always()
        run: |
          # The raw spec is not compared: the platform orders some of its maps differently
          # from one response to the next. The generated client is deterministic.
          if git diff --quiet -- api/platform.gen.go; then
            echo "The API of $PLATFORM matches the committed client." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The API of $PLATFORM changed. Run \`STEADYBIT_SPEC_URL=$STEADYBIT_SPEC_URL go run ./internal/tools/spec fetch && go generate ./api\` and commit the result."
            {
              echo "### The API of $PLATFORM changed"
              echo
              echo '```'
              git diff --stat -- api/platform.gen.go
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Every operation is called by a command or listed
        if: always() && inputs.coverage
        env:
          GH_TOKEN: ${{ github.token }}
          OPEN_ISSUE: ${{ inputs.issue && github.event_name == 'schedule' }}
        run: |
          go build -o "$RUNNER_TEMP/spec" ./internal/tools/spec
          status=0
          "$RUNNER_TEMP/spec" coverage openapi/platform-api.json >result.md 2>&1 || status=1
          {
            echo "Every operation of $STEADYBIT_SPEC_URL is called by a command, deprecated, or listed with a reason in"
            echo "[\`internal/tools/spec/coverage.go\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/internal/tools/spec/coverage.go)."
            echo "Those that are not need a command, or a line there saying why not."
            echo
            cat result.md
          } >coverage.md
          cat coverage.md >>"$GITHUB_STEP_SUMMARY"
          if [ "$OPEN_ISSUE" = true ]; then
            title="Platform API operations no CLI command covers"
            issue=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
            if [ "$status" -ne 0 ]; then
              printf '\nUpdated by %s/%s/actions/runs/%s.\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >>coverage.md
              if [ -n "$issue" ]; then
                gh issue edit "$issue" --body-file coverage.md
              else
                gh issue create --title "$title" --body-file coverage.md
              fi
            elif [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Every platform operation is covered or listed again, as of $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
            fi
          fi
          exit "$status"

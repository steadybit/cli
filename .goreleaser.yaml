# SPDX-FileCopyrightText: 2026 Steadybit GmbH

# Builds the release binaries, archives and checksums, and the GitHub release that carries
# them. The container image is built by the docker-build job.
version: 2
project_name: steadybit

before:
  hooks:
    # Shell completions, shipped in the archives and installed by the Homebrew cask.
    - rm -rf completions
    - mkdir completions
    - sh -c 'go run ./cmd/steadybit completion bash > completions/steadybit.bash'
    - sh -c 'go run ./cmd/steadybit completion zsh > completions/_steadybit'
    - sh -c 'go run ./cmd/steadybit completion fish > completions/steadybit.fish'

builds:
  - id: steadybit
    main: ./cmd/steadybit
    binary: steadybit
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/steadybit/cli/v6/internal/platform.Version={{ .Version }}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: steadybit
    # Without the version, so that releases/latest/download/<name> is a stable URL.
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md, completions/*]

# .deb and .rpm packages for Linux, attached to the release and published to the apt and
# yum repositories at packages.steadybit.com, next to steadybit-agent. Without the version
# in the file name, as the archives, so that releases/latest/download/<name> is stable.
nfpms:
  - id: steadybit
    package_name: steadybit-cli
    file_name_template: '{{ .PackageName }}_{{ .Arch }}'
    formats: [deb, rpm]
    vendor: Steadybit GmbH
    homepage: https://github.com/steadybit/cli
    maintainer: Steadybit <support@steadybit.com>
    description: Command-line interface for the Steadybit chaos engineering platform
    license: MIT
    contents:
      - src: completions/steadybit.bash
        dst: /usr/share/bash-completion/completions/steadybit
      - src: completions/_steadybit
        dst: /usr/share/zsh/vendor-completions/_steadybit
      - src: completions/steadybit.fish
        dst: /usr/share/fish/vendor_completions.d/steadybit.fish
      - src: LICENSE
        dst: /usr/share/doc/steadybit-cli/copyright
    # Signed with the key the agent's packages are signed with, when CI provides it; a
    # local snapshot builds them unsigned.
    deb:
      signature:
        key_file: '{{ if index .Env "NFPM_KEY_FILE" }}{{ .Env.NFPM_KEY_FILE }}{{ end }}'
    rpm:
      signature:
        key_file: '{{ if index .Env "NFPM_KEY_FILE" }}{{ .Env.NFPM_KEY_FILE }}{{ end }}'

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

release:
  # The changelog is written by hand in CHANGELOG.md.
  mode: keep-existing
  # A tag like v6.1.0-rc.1 is marked as a prerelease, so that releases/latest, which the
  # action installs by default, keeps pointing at the last stable version.
  prerelease: auto

changelog:
  disable: true

# `brew install steadybit/tap/steadybit`. The cask is pushed to steadybit/homebrew-tap,
# which the release's own GITHUB_TOKEN cannot write to.
homebrew_casks:
  - name: steadybit
    binaries: [steadybit]
    directory: Casks
    homepage: https://github.com/steadybit/cli
    description: Command-line interface for the Steadybit chaos engineering platform
    license: MIT
    # Prereleases stay off the tap, as they stay off releases/latest.
    skip_upload: auto
    commit_msg_template: 'steadybit {{ .Tag }}'
    completions:
      bash: completions/steadybit.bash
      zsh: completions/_steadybit
      fish: completions/steadybit.fish
    # The binaries are not notarized, and macOS refuses to run one downloaded by Homebrew
    # until the quarantine attribute is removed. Homebrew's declarative steps, since 5.1.14,
    # as the Ruby `postflight` that goreleaser's hooks write is deprecated. `{{staged_path}}`
    # is Homebrew's placeholder, escaped from goreleaser's own templates.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/steadybit"]
        end
      end
    repository:
      owner: steadybit
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
